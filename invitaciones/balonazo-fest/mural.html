<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural | BAL⚽NAZO FEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #1a8f33;
      --dark:   #050e07;
      --grass1: #1a6b2a;
      --grass2: #155a22;
      --font:   'Inter', sans-serif;
      --font-h: 'Playfair Display', serif;
      --font-card: 'Caveat', cursive;
    }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: var(--font);
      min-height: 100vh;
      padding-bottom: 80px;
      /* fondo base: oscuro con gradiente radial tipo luces de estadio */
      background:
        radial-gradient(ellipse 80% 50% at 50% 60%, rgba(26,143,51,.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 20% 20%, rgba(26,100,40,.14) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(10,80,30,.12) 0%, transparent 60%),
        linear-gradient(160deg, #071a0c 0%, #030d05 50%, #050e07 100%);
      background-attachment: fixed;
    }
    /* textura de gradas: líneas horizontales sutiles */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0px, transparent 18px,
          rgba(255,255,255,.018) 18px, rgba(255,255,255,.018) 19px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0px, transparent 40px,
          rgba(26,143,51,.025) 40px, rgba(26,143,51,.025) 41px
        );
    }
    /* orbes de luz fijos */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(circle 300px at 10% 15%, rgba(26,143,51,.12) 0%, transparent 70%),
        radial-gradient(circle 250px at 90% 85%, rgba(0,200,60,.08) 0%, transparent 70%),
        radial-gradient(circle 200px at 85% 10%, rgba(26,143,51,.07) 0%, transparent 70%),
        radial-gradient(circle 180px at 15% 90%, rgba(0,160,50,.07) 0%, transparent 70%);
    }

    /* ── DESTELLOS DE ESTADIO ── */
    .flash {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(var(--blur));
      width: var(--size); height: var(--size);
      top: var(--top); left: var(--left);
      background: var(--color);
      opacity: 0;
      animation: flash-pulse var(--dur) ease-in-out var(--delay) infinite;
    }
    @keyframes flash-pulse {
      0%   { opacity: 0; transform: scale(.85); }
      15%  { opacity: var(--peak); transform: scale(1.05); }
      30%  { opacity: 0; transform: scale(.9); }
      100% { opacity: 0; }
    }
    /* todo el contenido encima de los pseudo-elementos */
    .stadium-header, .counter-badge, .stadium-wrap, .compose-wrap,
    .bottom-bar, .toast, .modal-overlay { position: relative; z-index: 1; }

    /* ── HEADER ── */
    .stadium-header {
      text-align: center;
      padding: 1.25rem 1rem .75rem;
      position: relative; z-index: 10;
    }
    .header-kicker {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .65rem; font-weight: 700; letter-spacing: .2em;
      text-transform: uppercase; color: #4ade80; margin-bottom: .4rem;
    }
    .kicker-line { display: inline-block; width: 1.2rem; height: 1px; background: currentColor; }
    .mural-title {
      font-family: var(--font-h);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: #fff;
      text-shadow: 0 0 24px rgba(26,143,51,.7), 0 2px 6px rgba(0,0,0,.5);
      letter-spacing: .02em;
    }
    .header-divider {
      width: 40px; height: 2px;
      background: linear-gradient(90deg, var(--accent), #4ade80);
      border-radius: 9999px; margin: .6rem auto 0;
    }

    /* ── COUNTER ── */
    .counter-badge { display: flex; justify-content: center; margin: .5rem 0 .75rem; }
    .counter-pill {
      display: inline-flex; align-items: center; gap: .35rem;
      background: rgba(26,143,51,.18); border: 1px solid rgba(26,143,51,.35);
      border-radius: 9999px; padding: .25rem .8rem;
      font-size: .7rem; font-weight: 600; color: rgba(255,255,255,.7);
    }
    .counter-dot {
      width: .4rem; height: .4rem; border-radius: 50%; background: #4ade80;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.3; transform:scale(.6); }
    }

    /* ── STADIUM WRAPPER ── */
    .stadium-wrap {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 .5rem;
    }

    /* ── PITCH ROW: laterales + cancha ── */
    .pitch-row {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    /* ── CANCHA ── */
    .pitch-wrap {
      flex: 1;
      min-width: 0;
      position: relative;
      border-radius: .5rem;
      overflow: hidden;
      box-shadow:
        0 0 0 3px rgba(255,255,255,.07),
        0 0 40px rgba(26,143,51,.3),
        0 8px 32px rgba(0,0,0,.6);
    }
    .pitch-wrap::before {
      content: '';
      display: block;
      padding-bottom: 56%; /* aspect ratio */
    }
    .pitch-inner {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        90deg,
        var(--grass1) 0px, var(--grass1) 12.5%,
        var(--grass2) 12.5%, var(--grass2) 25%
      );
    }
    .pitch-inner svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }

    /* ── TRIBUNA LATERAL (oeste/este) ── */
    .stand-side {
      display: flex;
      flex-direction: row; /* filas = columnas visuales */
      gap: 3px;
      flex-shrink: 0;
      align-items: center;
    }
    .stand-side-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: center;
    }

    /* ── TRIBUNA HORIZONTAL (norte/sur) ── */
    .stand-horiz {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
    }
    .stand-horiz-row {
      display: flex;
      justify-content: center;
      gap: 3px;
    }

    /* ── FAN CARD ── */
    .fan-card {
      border-radius: .5rem;
      position: relative;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .fan-card:hover {
      transform: scale(1.18) translateY(-4px) !important;
      box-shadow: 0 10px 24px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.5) !important;
      z-index: 50;
    }
    /* franja inferior tipo nombre en dorsal */
    .fan-body {
      flex: 1;
      padding: .3rem .35rem .2rem;
      font-family: var(--font-card);
      color: rgba(0,0,0,.82);
      line-height: 1.25;
      word-break: break-word;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
    }
    /* franja inferior tipo nombre en dorsal */
    .fan-bottom {
      background: rgba(0,0,0,.22);
      padding: .18rem .35rem;
      flex-shrink: 0;
    }
    .fan-author {
      font-family: var(--font-card);
      font-weight: 700;
      color: rgba(255,255,255,.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      letter-spacing: .04em;
      text-shadow: 0 1px 2px rgba(0,0,0,.4);
      text-align: center;
    }
    /* borde brillante lateral izquierdo tipo acento de camiseta */
    .fan-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: rgba(255,255,255,.35);
      border-radius: 3px 0 0 3px;
      z-index: 1;
    }
    /* asiento vacío */
    .fan-empty {
      opacity: .15;
      box-shadow: none !important;
      background: rgba(255,255,255,.06) !important;
      border: 1px dashed rgba(255,255,255,.15) !important;
      align-items: center;
      justify-content: center;
    }
    .fan-empty::before { display: none; }

    @keyframes pop-in {
      from { opacity:0; transform:scale(.6); }
      to   { opacity:1; transform:scale(1); }
    }
    .fan-card { animation: pop-in .3s cubic-bezier(.34,1.56,.64,1) both; }

    /* ── COMPOSE ── */
    .compose-wrap {
      max-width: 380px; margin: 1.25rem auto 0;
      position: relative; z-index: 10;
    }
    .compose-card {
      border-radius: .875rem;
      padding: 1rem 1.1rem .9rem;
      background: #fff;
      box-shadow: 0 0 0 2px var(--accent), 0 6px 24px rgba(0,0,0,.5);
      display: none;
    }
    .compose-label {
      font-size: .65rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: .45rem; display: flex; align-items: center; gap: .3rem;
    }
    .compose-card textarea {
      width: 100%; resize: none; border: none; outline: none;
      font-family: var(--font-card); font-size: 1.2rem; line-height: 1.4;
      color: #1e293b; background: transparent; min-height: 70px;
    }
    .compose-card textarea::placeholder { color: #94a3b8; font-style: italic; }
    .compose-name-row { display: flex; align-items: center; margin-top: .35rem; }
    .compose-name-input {
      flex: 1; border: none; border-bottom: 1.5px solid rgba(0,0,0,.12);
      outline: none; font-family: var(--font-card); font-size: .9rem;
      font-weight: 600; color: var(--accent); background: transparent; padding: .12rem 0;
    }
    .compose-name-input::placeholder { color: #94a3b8; font-weight: 400; }
    .compose-footer {
      display: flex; align-items: center; gap: .3rem;
      margin-top: .65rem; flex-wrap: wrap;
    }
    .color-dot {
      width: 1.25rem; height: 1.25rem; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; flex-shrink: 0;
      transition: transform .15s, border-color .15s;
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.active { border-color: #0f172a; transform: scale(1.2); }
    .compose-submit {
      margin-left: auto;
      background: linear-gradient(135deg, var(--accent), #0d5c22);
      color: #fff; border: none; border-radius: 9999px;
      padding: .4rem 1.1rem; font-size: .82rem; font-weight: 700;
      cursor: pointer; transition: opacity .2s, transform .2s;
      box-shadow: 0 3px 10px rgba(26,143,51,.4);
    }
    .compose-submit:hover { opacity: .9; transform: translateY(-1px); }
    .compose-submit:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── EMPTY ── */
    .empty-state {
      text-align: center; padding: 1rem;
      color: rgba(255,255,255,.3); font-size: .8rem;
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      position: fixed; inset-x: 0; bottom: 0; z-index: 50;
      background: rgba(5,14,7,.9); backdrop-filter: blur(12px);
      border-top: 1px solid rgba(26,143,51,.25); padding: .6rem 1rem;
    }
    .bottom-inner {
      max-width: 500px; margin: 0 auto;
      display: flex; gap: .5rem; align-items: center;
    }
    .bar-btn {
      flex: 1; display: flex; align-items: center; justify-content: center;
      gap: .35rem; padding: .65rem; border-radius: 9999px;
      font-size: .85rem; font-weight: 700; cursor: pointer; border: none;
      transition: opacity .2s, transform .2s;
    }
    .bar-btn:hover { opacity: .88; transform: translateY(-1px); }
    .bar-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .bar-btn-green {
      background: linear-gradient(135deg, var(--accent), #0d5c22);
      color: #fff; box-shadow: 0 3px 12px rgba(26,143,51,.4);
    }
    .bar-btn-outline {
      background: transparent; border: 1.5px solid rgba(255,255,255,.18);
      color: rgba(255,255,255,.7);
    }
    .bar-back {
      color: rgba(255,255,255,.4); font-size: .75rem;
      text-decoration: none; white-space: nowrap; padding: .35rem;
    }
    .bar-back:hover { color: #fff; }

    /* ── DETAIL MODAL ── */
    .detail-card {
      width: 100%; max-width: 360px;
      border-radius: 1.25rem;
      padding: 1.75rem 1.5rem 1.25rem;
      position: relative;
      box-shadow: 0 0 0 2px var(--accent), 0 24px 60px rgba(0,0,0,.7);
      animation: modal-in .3s cubic-bezier(.34,1.56,.64,1);
    }
    .detail-ball {
      position: absolute; top: 1rem; right: 1.1rem;
      font-size: 1.6rem; opacity: .15;
    }
    .detail-msg {
      font-family: var(--font-card);
      font-size: 1.35rem;
      line-height: 1.55;
      color: rgba(0,0,0,.85);
      word-break: break-word;
      margin-bottom: .75rem;
    }
    .detail-divider { height: 1px; background: rgba(0,0,0,.1); margin-bottom: .6rem; }
    .detail-author {
      font-family: var(--font-card);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: .2rem;
    }
    .detail-time { font-size: .72rem; color: rgba(0,0,0,.35); margin-bottom: 1rem; }
    .detail-close {
      width: 100%; padding: .55rem;
      border: 1.5px solid rgba(26,143,51,.3);
      border-radius: 9999px;
      background: transparent;
      color: var(--accent);
      font-size: .82rem; font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    .detail-close:hover { background: rgba(26,143,51,.08); }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      transition: opacity .3s;
    }
    .modal-overlay.hidden { opacity: 0; pointer-events: none; }
    .modal-card {
      width: 100%; max-width: 400px;
      background: #fff;
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 0 0 2px var(--accent), 0 24px 60px rgba(0,0,0,.6);
      animation: modal-in .35s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes modal-in {
      from { opacity:0; transform:scale(.88) translateY(20px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }
    .modal-header {
      background: linear-gradient(135deg, #0d5c22, var(--accent));
      padding: 1.25rem 1.5rem 1rem;
      text-align: center;
    }
    .modal-emoji { font-size: 2rem; display: block; margin-bottom: .35rem; }
    .modal-title {
      font-family: var(--font-h); font-size: 1.4rem;
      color: #fff; margin-bottom: .25rem;
    }
    .modal-sub { font-size: .78rem; color: rgba(255,255,255,.7); }
    .modal-body { padding: 1.1rem 1.25rem .75rem; }
    .modal-skip {
      display: block; width: 100%;
      padding: .75rem; border: none; background: #f8fafc;
      border-top: 1px solid #e5e7eb;
      font-size: .78rem; color: #94a3b8;
      cursor: pointer; text-align: center;
      transition: color .2s, background .2s;
    }
    .modal-skip:hover { color: var(--accent); background: #f0fdf4; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 5rem; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: linear-gradient(135deg, var(--accent), #0d5c22);
      color: #fff; padding: .6rem 1.4rem; border-radius: 9999px;
      font-weight: 700; font-size: .82rem;
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .5s ease;
      z-index: 100; white-space: nowrap;
      opacity: 0;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.hide { opacity: 0; }
  </style>
</head>
<body>

<div id="flashes"></div>

<div class="stadium-header">
  <h1 class="mural-title">🌟 Mural de Amor para Josué y Arturo</h1>
  <div class="header-divider"></div>
</div>



<div class="stadium-wrap">
  <!-- TRIBUNA NORTE -->
  <div class="stand-horiz" id="stand-north"></div>

  <!-- CANCHA + LATERALES -->
  <div class="pitch-row">
    <div class="stand-side" id="stand-west"></div>

    <div class="pitch-wrap">
      <div class="pitch-inner">
        <svg viewBox="0 0 100 56" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.5" y="1.5" width="97" height="53" fill="none" stroke="rgba(255,255,255,.3)" stroke-width=".6"/>
          <line x1="50" y1="1.5" x2="50" y2="54.5" stroke="rgba(255,255,255,.3)" stroke-width=".5"/>

          <rect x="1.5" y="15" width="13" height="26" fill="none" stroke="rgba(255,255,255,.25)" stroke-width=".45"/>
          <rect x="1.5" y="21" width="5.5" height="14" fill="none" stroke="rgba(255,255,255,.2)" stroke-width=".4"/>
          <rect x="85.5" y="15" width="13" height="26" fill="none" stroke="rgba(255,255,255,.25)" stroke-width=".45"/>
          <rect x="93" y="21" width="5.5" height="14" fill="none" stroke="rgba(255,255,255,.2)" stroke-width=".4"/>
          <path d="M14.5 23 Q20 28 14.5 33" fill="none" stroke="rgba(255,255,255,.18)" stroke-width=".4"/>

</div>

<div class="compose-wrap">

</div>

<div class="bottom-bar">

    <a href="index.html" class="bar-back">← Invitación</a>

    <button class="bar-btn bar-btn-outline" onclick="shareUrl()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
      Compartir
    </button>
  </div>
</div>

<div class="toast" id="toast">🎉 ¡Mensaje publicado!</div>

<!-- MODAL DETALLE MENSAJE -->
<div class="modal-overlay" id="detail-overlay" onclick="closeDetail(event)">
  <div class="detail-card" id="detail-card">
    <div class="detail-ball">⚽</div>
    <div class="detail-msg" id="detail-msg"></div>
    <div class="detail-divider"></div>
    <div class="detail-author" id="detail-author"></div>
    <div class="detail-time" id="detail-time"></div>
    <button class="detail-close" onclick="document.getElementById('detail-overlay').classList.add('hidden')">✕ Cerrar</button>
  </div>
</div>

<!-- MODAL BIENVENIDA -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-emoji">✍️</span>
      <h2 class="modal-title">Deja tu mensaje</h2>
      <p class="modal-sub">Tu pancarta aparecerá en las gradas del estadio</p>
    </div>
    <div class="modal-body" id="modal-compose"></div>
    <button class="modal-skip" onclick="closeModal()">Ver el estadio sin escribir →</button>
  </div>
</div>

<script>
  const COLORS = ['#FFFFFF','#FEF9C3','#FCE7F3','#DBEAFE','#DCFCE7','#EDE9FE','#FFF7ED','#CFFAFE'];
  const STORAGE_KEY = 'balnazo_mural';
  let selectedColor = COLORS[4];

  // ── DESTELLOS ─────────────────────────────────────────────────
  const FLASHES = [
    { top:'2%',  left:'3%',  size:'180px', blur:'60px', dur:'3.2s', delay:'0s',   peak:.28, color:'rgba(220,255,200,.9)' },
    { top:'2%',  left:'94%', size:'180px', blur:'60px', dur:'2.8s', delay:'.7s',  peak:.28, color:'rgba(220,255,200,.9)' },
    { top:'88%', left:'3%',  size:'180px', blur:'60px', dur:'3.5s', delay:'1.4s', peak:.25, color:'rgba(200,255,180,.9)' },
    { top:'88%', left:'94%', size:'180px', blur:'60px', dur:'3.0s', delay:'2.1s', peak:.25, color:'rgba(200,255,180,.9)' },
    { top:'8%',  left:'25%', size:'60px',  blur:'20px', dur:'1.8s', delay:'.3s',  peak:.55, color:'rgba(255,255,255,.95)' },
    { top:'6%',  left:'60%', size:'50px',  blur:'18px', dur:'2.1s', delay:'1.1s', peak:.6,  color:'rgba(255,255,255,.95)' },
    { top:'10%', left:'45%', size:'45px',  blur:'16px', dur:'1.5s', delay:'2.3s', peak:.5,  color:'rgba(255,255,255,.95)' },
    { top:'85%', left:'30%', size:'55px',  blur:'18px', dur:'2.4s', delay:'.9s',  peak:.55, color:'rgba(255,255,255,.95)' },
    { top:'90%', left:'55%', size:'48px',  blur:'16px', dur:'1.9s', delay:'1.7s', peak:.5,  color:'rgba(255,255,255,.95)' },
    { top:'88%', left:'72%', size:'42px',  blur:'14px', dur:'2.2s', delay:'.5s',  peak:.6,  color:'rgba(255,255,255,.95)' },
    { top:'50%', left:'1%',  size:'52px',  blur:'18px', dur:'2.6s', delay:'1.3s', peak:.45, color:'rgba(255,255,255,.95)' },
    { top:'45%', left:'97%', size:'52px',  blur:'18px', dur:'2.0s', delay:'2.0s', peak:.45, color:'rgba(255,255,255,.95)' },
    { top:'30%', left:'35%', size:'320px', blur:'100px',dur:'4.5s', delay:'0s',   peak:.1,  color:'rgba(26,143,51,.8)' },
    { top:'40%', left:'55%', size:'280px', blur:'90px', dur:'5.0s', delay:'2.2s', peak:.08, color:'rgba(0,200,60,.8)' },
  ];
  (function(){
    const wrap = document.getElementById('flashes');
    FLASHES.forEach(f => {
      const el = document.createElement('div');
      el.className = 'flash';
      el.style.cssText = `--size:${f.size};--blur:${f.blur};--dur:${f.dur};--delay:${f.delay};--peak:${f.peak};--color:${f.color};--top:${f.top};--left:${f.left}`;
      wrap.appendChild(el);
    });
  })();

  // ── RESPONSIVE SIZES ──────────────────────────────────────────
  function getSizes() {
    const vw = window.innerWidth;
    if (vw < 400) return { nh:2, nw:72, nfs:.78, nfsa:.62, nlc:2, sh:2, sw:72, sfs:.78, sfsa:.62, slc:2, lh:56, lw:60, lfs:.72, lfsa:.58, llc:2, sideCols:2 };
    if (vw < 600) return { nh:2, nw:88, nfs:.84, nfsa:.66, nlc:2, sh:2, sw:88, sfs:.84, sfsa:.66, slc:2, lh:64, lw:72, lfs:.78, lfsa:.62, llc:2, sideCols:2 };
    if (vw < 800) return { nh:2, nw:104,nfs:.9,  nfsa:.72, nlc:3, sh:2, sw:104,sfs:.9,  sfsa:.72, slc:3, lh:74, lw:84, lfs:.82, lfsa:.65, llc:2, sideCols:2 };
    return              { nh:2, nw:120,nfs:.96, nfsa:.76, nlc:3, sh:2, sw:120,sfs:.96, sfsa:.76, slc:3, lh:82, lw:96, lfs:.88, lfsa:.68, llc:3, sideCols:3 };
  }

  // Cuántas cards caben por fila según ancho disponible
  function northCount(rowIdx, sz) {
    const vw = window.innerWidth;
    const pitchW = Math.min(vw - 16, 900) - (sz.sideCols * (sz.lw + 3) * 2) - 8;
    const perRow = Math.max(2, Math.floor(pitchW / (sz.nw + 3)));
    return perRow + rowIdx; // filas de atrás tienen más cards
  }

  // ── STORAGE ───────────────────────────────────────────────────
  async function fetchMessages() {
    if (!window.SHEETS_URL) return [];
    try {
      const res  = await fetch(window.SHEETS_URL + '?tipo=mural', {
        redirect: 'follow',
        mode: 'cors'
      });
      const data = await res.json();
      console.log('fetch ok', data);
      return Array.isArray(data) ? data : [];
    } catch(err) {
      console.error('fetch error', err);
      return [];
    }
  }
  async function saveMessage(entry) {
    if (!window.SHEETS_URL) return;
    await fetch(window.SHEETS_URL, {
      method: 'POST',
      body: JSON.stringify({ tipo: 'mural', ...entry })
    }).catch(() => {});
  }

  // ── MAKE CARD ─────────────────────────────────────────────────
  function makeCard(m, w, h, fs, fsa, lc, tilt, delay, side) {
    const card = document.createElement('div');
    if (!m) {
      card.className = 'fan-card fan-empty';
      card.style.cssText = `width:${w}px;height:${h}px;animation-delay:${delay}s`;
      card.innerHTML = '<span style="font-size:.8rem;opacity:.4">💺</span>';
      return card;
    }

    const shadow = `0 3px 10px rgba(0,0,0,.45), 0 0 0 1.5px rgba(255,255,255,.18)`;

    card.className = 'fan-card';
    card.style.cssText = `width:${w}px;height:${h}px;background:${m.color};transform:rotate(${tilt}deg);animation-delay:${delay}s;box-shadow:${shadow}`;
    card.addEventListener('click', () => openDetail(m));

    card.innerHTML = `
      <div class="fan-body" style="font-size:${fs}rem;-webkit-line-clamp:${lc}">${escHtml(m.mensaje)}</div>
      <div class="fan-bottom">
        <div class="fan-author" style="font-size:${fsa}rem">${escHtml(m.nombre)}</div>
      </div>`;

    return card;
  }

  // ── FILL NORTH / SOUTH ────────────────────────────────────────
  function fillHoriz(id, messages, startIdx, side, sz) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    let idx = startIdx;

    for (let row = 0; row < sz.nh; row++) {
      const rowEl = document.createElement('div');
      rowEl.className = 'stand-horiz-row';
      // perspectiva: filas de atrás más pequeñas
      const scale = 1 - row * 0.1;
      const opacity = 1 - row * 0.12;
      rowEl.style.cssText = `transform:scale(${scale});transform-origin:center bottom;opacity:${opacity};margin-bottom:-${row*2}px`;

      const count = northCount(row, sz);
      for (let col = 0; col < count; col++) {
        const m = idx < messages.length ? messages[idx++] : null;
        const center = (count - 1) / 2;
        const tilt = (col - center) * (side === 'south' ? -1.8 : 1.8);
        const delay = row * 0.05 + col * 0.03;
        const card = makeCard(m, sz.nw, sz.nh === 2 ? (row === 0 ? 58 : 50) : 54, sz.nfs, sz.nfsa, sz.nlc, tilt, delay, side);
        rowEl.appendChild(card);
      }
      if (side === 'north') el.appendChild(rowEl);
      else el.insertBefore(rowEl, el.firstChild);
    }
    return idx;
  }

  // ── FILL WEST / EAST ──────────────────────────────────────────
  function fillSide(id, messages, startIdx, side, sz) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    let idx = startIdx;

    for (let col = 0; col < sz.sideCols; col++) {
      const colEl = document.createElement('div');
      colEl.className = 'stand-side-col';
      const scale = 1 - col * 0.1;
      const opacity = 1 - col * 0.15;
      // oeste: primera col más cerca de cancha (derecha), este: primera col más cerca (izquierda)
      colEl.style.cssText = `transform:scale(${scale});opacity:${opacity}`;

      const rows = 3 + col;
      for (let row = 0; row < rows; row++) {
        const m = idx < messages.length ? messages[idx++] : null;
        const center = (rows - 1) / 2;
        const tilt = (row - center) * (side === 'west' ? -1.5 : 1.5);
        const delay = col * 0.06 + row * 0.04;
        const card = makeCard(m, sz.lw, sz.lh, sz.lfs, sz.lfsa, sz.llc, tilt, delay, side);
        colEl.appendChild(card);
      }
      if (side === 'west') el.insertBefore(colEl, el.firstChild);
      else el.appendChild(colEl);
    }
    return idx;
  }

  function closeDetail(e) {
    if (e.target === document.getElementById('detail-overlay'))
      document.getElementById('detail-overlay').classList.add('hidden');
  }
  function openDetail(m) {
    const card = document.getElementById('detail-card');
    card.style.background = m.color;
    document.getElementById('detail-msg').textContent    = m.mensaje;
    document.getElementById('detail-author').textContent = '— ' + m.nombre;
    document.getElementById('detail-time').textContent   =
      new Date(m.timestamp).toLocaleString('es-MX', { dateStyle:'medium', timeStyle:'short' });
    document.getElementById('detail-overlay').classList.remove('hidden');
  }

  // ── MODAL ──────────────────────────────────────────────────
  function openModal() {
    buildModalCompose();
    document.getElementById('modal-overlay').classList.remove('hidden');
  }
  function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  function buildModalCompose() {
    const wrap = document.getElementById('modal-compose');
    wrap.style.background = selectedColor;
    wrap.style.borderRadius = '.75rem';
    wrap.style.padding = '.75rem .9rem .65rem';
    wrap.style.marginBottom = '.5rem';
    wrap.style.boxShadow = '0 0 0 1.5px rgba(26,143,51,.3)';
    wrap.innerHTML = '';

    const label = document.createElement('div');
    label.className = 'compose-label';
    label.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Tu mensaje`;

    const ta = document.createElement('textarea');
    ta.rows = 3; ta.maxLength = 280;
    ta.placeholder = 'Escribe algo bonito para los festejados…';
    ta.style.cssText = 'width:100%;resize:none;border:none;outline:none;font-family:var(--font-card);font-size:1.2rem;line-height:1.4;color:#1e293b;background:transparent;min-height:70px';
    ta.addEventListener('input', () => {
      document.getElementById('modal-btn').disabled = !ta.value.trim();
    });

    const nameRow = document.createElement('div');
    nameRow.style.cssText = 'display:flex;align-items:center;margin-top:.35rem';
    const ni = document.createElement('input');
    ni.type = 'text'; ni.className = 'compose-name-input';
    ni.id = 'modal-name'; ni.placeholder = '— Tu nombre'; ni.maxLength = 40;
    nameRow.appendChild(ni);

    const footer = document.createElement('div');
    footer.className = 'compose-footer';
    COLORS.forEach(c => {
      const dot = document.createElement('button');
      dot.className = 'color-dot' + (c === selectedColor ? ' active' : '');
      dot.style.background = c;
      dot.style.borderColor = c === '#FFFFFF' ? '#d1d5db' : 'transparent';
      dot.setAttribute('aria-label', c);
      dot.addEventListener('click', () => {
        selectedColor = c; wrap.style.background = c;
        wrap.querySelectorAll('.color-dot').forEach(d => {
          d.classList.remove('active');
          d.style.borderColor = d.getAttribute('aria-label') === '#FFFFFF' ? '#d1d5db' : 'transparent';
        });
        dot.classList.add('active'); dot.style.borderColor = '#0f172a';
      });
      footer.appendChild(dot);
    });

    const btn = document.createElement('button');
    btn.className = 'compose-submit'; btn.textContent = 'Listo ✓';
    btn.disabled = true; btn.id = 'modal-btn';
    btn.addEventListener('click', () => {
      const msg = ta.value.trim();
      if (!msg) return;
      const nombre = ni.value.trim() || 'Anónimo';
      const entry  = { mensaje: msg, nombre, color: selectedColor, timestamp: Date.now() };
      saveMessage(entry).then(() => { closeModal(); render(); showToast(); });
    });
    footer.appendChild(btn);

    wrap.appendChild(label); wrap.appendChild(ta);
    wrap.appendChild(nameRow); wrap.appendChild(footer);
  }

  // ── RENDER ────────────────────────────────────────────────────
  async function render() {
    const list = await fetchMessages();
    list.reverse();
    document.getElementById('empty-state').style.display =
      list.length === 0 ? 'block' : 'none';
    const sz = getSizes();
    let idx = 0;
    idx = fillHoriz('stand-north', list, idx, 'north', sz);
    idx = fillHoriz('stand-south', list, idx, 'south', sz);
    idx = fillSide('stand-west',  list, idx, 'west',  sz);
    idx = fillSide('stand-east',  list, idx, 'east',  sz);
    buildComposeCard();
  }

  // ── COMPOSE ───────────────────────────────────────────────────
  function buildComposeCard() {
    const wrap = document.getElementById('compose-card');
    wrap.style.background = selectedColor;
    wrap.innerHTML = '';

    const label = document.createElement('div');
    label.className = 'compose-label';
    label.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Tu mensaje`;

    const ta = document.createElement('textarea');
    ta.rows = 3; ta.maxLength = 280;
    ta.placeholder = 'Escribe algo bonito para los festejados…';
    ta.addEventListener('input', () => {
      const v = ta.value.trim();
      document.getElementById('compose-btn').disabled = !v;
      document.getElementById('bar-submit').disabled  = !v;
    });

    const nameRow = document.createElement('div');
    nameRow.className = 'compose-name-row';
    const ni = document.createElement('input');
    ni.type = 'text'; ni.className = 'compose-name-input';
    ni.id = 'compose-name'; ni.placeholder = '— Tu nombre'; ni.maxLength = 40;
    nameRow.appendChild(ni);

    const footer = document.createElement('div');
    footer.className = 'compose-footer';
    COLORS.forEach(c => {
      const dot = document.createElement('button');
      dot.className = 'color-dot' + (c === selectedColor ? ' active' : '');
      dot.style.background = c;
      dot.style.borderColor = c === '#FFFFFF' ? '#d1d5db' : 'transparent';
      dot.setAttribute('aria-label', c);
      dot.addEventListener('click', () => {
        selectedColor = c; wrap.style.background = c;
        wrap.querySelectorAll('.color-dot').forEach(d => {
          d.classList.remove('active');
          d.style.borderColor = d.getAttribute('aria-label') === '#FFFFFF' ? '#d1d5db' : 'transparent';
        });
        dot.classList.add('active'); dot.style.borderColor = '#0f172a';
      });
      footer.appendChild(dot);
    });

    const btn = document.createElement('button');
    btn.className = 'compose-submit'; btn.textContent = 'Listo ✓';
    btn.disabled = true; btn.id = 'compose-btn';
    btn.addEventListener('click', submitMessage);
    footer.appendChild(btn);

    wrap.appendChild(label); wrap.appendChild(ta);
    wrap.appendChild(nameRow); wrap.appendChild(footer);
  }

  // ── SUBMIT ────────────────────────────────────────────────────
  async function submitMessage() {
    const ta  = document.querySelector('#compose-card textarea');
    const msg = ta ? ta.value.trim() : '';
    if (!msg) return;
    const nombre = document.getElementById('compose-name').value.trim() || 'Anónimo';
    const entry  = { mensaje: msg, nombre, color: selectedColor, timestamp: Date.now() };
    await saveMessage(entry);
    render();
    showToast();
  }

  function shareUrl() {
    const url = window.location.href;
    if (navigator.share) { navigator.share({ title: 'Mural BAL⚽NAZO FEST', url }); }
    else {
      navigator.clipboard.writeText(url).then(() => {
        const t = document.getElementById('toast');
        t.textContent = '🔗 ¡Link copiado!';
        t.classList.add('show');
        setTimeout(() => { t.classList.remove('show'); t.textContent = '🎉 ¡Mensaje publicado!'; }, 2500);
      });
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function showToast() {
    const t = document.getElementById('toast');
    t.textContent = '🎉 ¡Mensaje publicado!';
    t.classList.remove('hide');
    t.classList.add('show');
    setTimeout(() => {
      t.classList.add('hide');
      setTimeout(() => t.classList.remove('show', 'hide'), 500);
    }, 2000);
  }

  render();
  openModal();
  window.addEventListener('resize', render);
  console.log('SHEETS_URL:', window.SHEETS_URL);
  closeModal();
</script>
</body>
</html>
